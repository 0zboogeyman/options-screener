version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: spread-backend:latest
    container_name: spread-backend
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    environment:
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=["https://option.311472.xyz"]
      - DATA_ROOT=/app/data/parquet
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:3115:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BASE_PATH=/spread-finder
    image: spread-frontend:latest
    container_name: spread-frontend
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_PATH=/spread-finder
    ports:
      - "127.0.0.1:3116:3000"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
