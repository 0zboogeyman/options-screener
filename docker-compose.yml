version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: spread-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data:rw
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "127.0.0.1:3115:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_BASE_PATH=/spread-finder
        - NEXT_PUBLIC_API_PROXY_DEST=http://backend:8000
    container_name: spread-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3116:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/spread-finder"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  default:
    name: spread-net
