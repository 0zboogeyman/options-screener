; =============================================================================
; supervisord.conf - 单容器部署的进程管理器
; -----------------------------------------------------------------------------
; 前端为静态导出，由 FastAPI 同源托管，容器内只剩两个进程：
;   * backend       : uvicorn 提供 FastAPI 服务（页面 + API）  0.0.0.0:3000
;   * etl-scheduler : 每日定时 ETL
; 两进程均继承容器的 stdout/stderr，`docker compose logs` 体验不变。
; =============================================================================

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:backend]
command=uvicorn app.main:app --host 0.0.0.0 --port 3000 --proxy-headers --forwarded-allow-ips 127.0.0.1
directory=/app
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=15
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:etl-scheduler]
command=python /app/scripts/etl_scheduler.py
directory=/app
environment=PYTHONPATH="/app"
priority=30
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
