; =============================================================================
; supervisord.conf - 单容器部署的进程管理器
; -----------------------------------------------------------------------------
; 将原本"每容器一个进程"的两个服务托管到同一个容器内：
;   * backend  : uvicorn 提供 FastAPI 服务  0.0.0.0:8000
;   * frontend : Node.js Next.js standalone 服务 0.0.0.0:3000
; 两进程均继承容器的 stdout/stderr，`docker compose logs` 的体验与原先
; 双容器一致（日志交错出现）。
; =============================================================================

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:backend]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips 127.0.0.1
directory=/app
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=15
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:frontend]
command=node /app/frontend/server.js
directory=/app/frontend
environment=NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0"
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:etl-scheduler]
command=python /app/scripts/etl_scheduler.py
directory=/app
environment=PYTHONPATH="/app"
priority=30
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
